##############################################################
# CognitiveVault — Docker Compose
##############################################################
# This file defines the Qdrant vector database service.
#
# USAGE:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs qdrant
#
# After starting, the Qdrant dashboard is available at:
#   http://localhost:6333/dashboard
##############################################################

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cognitivevault_qdrant
    ports:
      # 6333 = HTTP REST API (what our Python client uses)
      - "6333:6333"
      # 6334 = gRPC API (faster for high-throughput; not needed yet)
      - "6334:6334"
    volumes:
      # Persist vector data to a local folder so it survives container restarts.
      # The data is stored in ./qdrant_storage/ (relative to this file).
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
