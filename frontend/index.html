<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CognitiveVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!--
      Tailwind Play CDN — handles all utility classes at runtime.
      Supports arbitrary values (bg-[#1F2023], border-[#444444], etc.)
      No PostCSS / build step required.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              'dot-bounce': {
                '0%, 80%, 100%': { transform: 'translateY(0)', opacity: '0.4' },
                '40%':           { transform: 'translateY(-5px)', opacity: '1' },
              },
              'blink': {
                '0%, 100%': { opacity: '1' },
                '50%':      { opacity: '0' },
              },
            },
            animation: {
              'dot-bounce': 'dot-bounce 1.3s ease-in-out infinite',
              'blink':      'blink 0.9s step-end infinite',
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
